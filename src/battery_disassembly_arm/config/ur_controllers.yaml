controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true

    # 强力 PID 增益配置（用于精确轨迹跟踪）
    # 调整 D 增益以减少高频抖动
    gains:
      shoulder_pan_joint:
        p: 2000.0
        i: 0.1
        d: 10.0
        i_clamp: 1.0
        ff_velocity_scale: 1.0
      shoulder_lift_joint:
        p: 2500.0
        i: 0.1
        d: 12.0
        i_clamp: 1.0
        ff_velocity_scale: 1.0
      elbow_joint:
        p: 2000.0
        i: 0.1
        d: 10.0
        i_clamp: 1.0
        ff_velocity_scale: 1.0
      wrist_1_joint:
        p: 1500.0
        i: 0.1
        d: 8.0
        i_clamp: 1.0
        ff_velocity_scale: 1.0
      wrist_2_joint:
        p: 1500.0
        i: 0.1
        d: 8.0
        i_clamp: 1.0
        ff_velocity_scale: 1.0
      wrist_3_joint:
        p: 1000.0
        i: 0.1
        d: 5.0
        i_clamp: 1.0
        ff_velocity_scale: 1.0

    # 放宽容差以避免控制器提前中止
    constraints:
      stopped_velocity_tolerance: 0.5
      goal_time: 0.0
      shoulder_pan_joint:
        trajectory: 0.2
        goal: 0.2
      shoulder_lift_joint:
        trajectory: 0.2
        goal: 0.2
      elbow_joint:
        trajectory: 0.2
        goal: 0.2
      wrist_1_joint:
        trajectory: 0.2
        goal: 0.2
      wrist_2_joint:
        trajectory: 0.2
        goal: 0.2
      wrist_3_joint:
        trajectory: 0.2
        goal: 0.2
